[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = -v --tb=short --strict-markers -p no:warnings
markers =
    slow: marks tests as slow-running (deselect with -m "not slow")
log_cli = true
log_cli_level = WARNING
log_format = %(levelname)s %(name)s: %(message)s
# Per-test wall-clock cap. `thread` method so a test blocked in a C-level or
# socket call is still interrupted — the default signal method cannot preempt
# a thread stuck inside a blocking library call.
timeout = 300
timeout_method = thread
